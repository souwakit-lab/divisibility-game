<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11152b">
  <title>石排灣魔法冒險｜教師大屏</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body class="dashboard-page">
  <div class="shell-bg"></div>
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <div><p class="eyebrow">LIVE CLASSROOM · GEM MONITOR</p><h1>七寶石守護者大屏</h1><p class="muted">學生答題後自動更新；點擊寶石查看名單。</p></div>
      <div class="dashboard-actions"><select id="class-filter"><option value="">全班總覽</option></select><button class="toolbar-button" id="fullscreen-button">全螢幕</button></div>
    </header>
    <section class="summary-grid">
      <article class="metric"><span>總參加人數</span><strong id="stat-players">0</strong></article>
      <article class="metric"><span>已答對人次</span><strong id="stat-correct">0</strong></article>
      <article class="metric"><span>總答題次數</span><strong id="stat-attempts">0</strong></article>
      <article class="metric"><span>最後更新</span><strong id="updated-at">等待資料</strong></article>
    </section>
    <section class="gem-dashboard" id="gem-grid"></section>
    <section class="dashboard-note">狀態說明：<b class="legend correct">已答對</b><b class="legend wrong">曾答錯</b><b class="legend pending">未答對</b>　答對後會從答錯名單中移除。</section>
  </main>
  <div class="modal-backdrop" id="modal-backdrop" hidden><section class="roster-modal"><button class="close" id="close-modal">×</button><div id="modal-content"></div></section></div>
  <script src="config.js"></script>
  <script src="gem-dashboard.js"></script>
</body>
</html>
